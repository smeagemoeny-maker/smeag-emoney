<meta charset="utf-8" />

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml" />
<title>SMEAG Campus Office</title>

<style>
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
  .bar { display: flex; align-items: center; gap: 12px; padding: 14px 0; flex-wrap: wrap; }
  .bar h1 { font-size: 19px; margin: 0; flex: 1; min-width: 0; }
  .tabsA { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabsA button { border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--ink2); border-bottom: 2px solid transparent; cursor: pointer; }
  .tabsA button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters .input { width: auto; min-height: 38px; padding: 7px 10px; max-width: 100%; }
  .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 12px; }
  .act { display: grid; gap: 8px; margin-top: 10px; }
  .act textarea { min-height: 52px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th, .tbl td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl th { color: var(--ink2); font-weight: 600; font-size: 12px; }
  .scroll { overflow-x: auto; }
  .formgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 10px; }
  .codebox { font-family: var(--mono); font-size: 28px; letter-spacing: .25em; background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 10px 14px; display: inline-block; }
  .count { font-size: 12px; color: var(--ink2); }
  pre.sample { background: var(--soft); border-radius: 10px; padding: 10px; font-size: 12px; overflow-x: auto; margin: 0; }
  .langsel { min-height: 34px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card, transparent); color: inherit; font: inherit; font-size: 13px; width: auto; }
  .langrow { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  #stuSearch { min-width: min(260px, 100%); }
  @media (max-width: 640px) { .bar { gap: 8px; } .bar h1 { flex: 1 1 100%; } }
</style>
</head>

  var editing = null;

    if (f[2] === 'bool') return '<select class="input" id="' + id + '"><option value="true"' + (v !== false ? ' selected' : '') + '>' + esc(t('yes')) + '</option><option value="false"' + (v === false ? ' selected' : '') + '>' + esc(t('no')) + '</option></select>';
    if (f[2] === 'kind') return '<select class="input" id="' + id + '">' + ['activity', 'pickup', 'car', 'course'].map(function (k) { return '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' + esc(kindName(k)) + '</option>'; }).join('') + '</select>';
    if (f[2] === 'unit') return '<select class="input" id="' + id + '">' + [['once', t('once')], ['day', t('perDay')], ['week', t('perWeek')]].map(function (k) { return '<option value="' + k[0] + '"' + (v === k[0] ? ' selected' : '') + '>' + esc(k[1]) + '</option>'; }).join('') + '</select>';

  function showCrud(name) {

        return '<div class="li"><span>' + CRUD[name].line(r) + '</span><span class="v"><button class="btn ghost small" data-edit="' + r.id + '">' + esc(t('edit')) + '</button></span></div>';

  // ---------- scores ----------
  function showScores() {
    frame('<div class="card stack"><b>' + esc(t('importTitle')) + '</b><p class="small muted" style="margin:0">' + esc(t('importHelp')) + '</p>' +
      '<pre class="sample">studentId,test,date,listening,reading,writing,speaking,overall,comment\nP510M5TYS,IELTS,2026-11-14,6.5,7,6,6.5,6.5,Good progress in reading</pre>' +
      '<textarea class="input" id="csv" style="min-height:160px;font-family:var(--mono);font-size:12px" placeholder="' + esc(t('pastePh')) + '"></textarea><div class="row"><button class="btn small" id="previewCsv">' + esc(t('checkRows')) + '</button><button class="btn small" id="importCsv" disabled>' + esc(t('importBtn')) + '</button><span class="count" id="csvInfo"></span></div></div>' +
      '<div class="card" style="margin-top:12px"><form id="scoreFind" class="filters" style="margin:0 0 8px"><input class="input" id="scoreSid" placeholder="' + esc(t('scoreSidPh')) + '"><button class="btn small" type="submit">' + esc(t('showScores')) + '</button></form><div class="scroll" id="scoreList"></div></div>');
  }
  var csvRows = [];
  function parseCsv(text) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (lines.length < 2) return [];
    var sep = lines[0].indexOf('\t') >= 0 ? '\t' : ',';
    var head = lines[0].split(sep).map(function (h) { return h.trim().replace(/^"|"$/g, ''); });
    var norm = function (h) { var k = h.toLowerCase().replace(/[^a-z]/g, ''); return { studentid: 'studentId', sid: 'studentId', test: 'test', date: 'date', testdate: 'date', listening: 'listening', reading: 'reading', writing: 'writing', speaking: 'speaking', overall: 'overall', total: 'overall', comment: 'comment' }[k]; };
    var keys = head.map(norm);
    return lines.slice(1).map(function (l) {
      var cells = l.split(sep).map(function (c) { return c.trim().replace(/^"|"$/g, ''); });
      var o = {}; keys.forEach(function (k, i) { if (k) o[k] = cells[i]; }); return o;
    });
  }
  function scoreTable(rows) {
    return rows.length ? '<table class="tbl"><thead><tr><th>' + esc(t('thStudentId')) + '</th><th>' + esc(t('thTest')) + '</th><th>' + esc(t('thDate')) + '</th><th>L</th><th>R</th><th>W</th><th>S</th><th>' + esc(t('thOverall')) + '</th><th>' + esc(t('thComment')) + '</th></tr></thead><tbody>' + rows.map(function (r) {

    }).join('') + '</tbody></table>' : '<div class="empty">' + esc(t('noScores')) + '</div>';
  }

  function show() {
    if (!session) return renderLogin();
    if (tab === 'requests') return showRequests();

    if (tab === 'scores') return showScores();

  // ---------- events ----------
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = e.target.id;
    if (id === 'loginForm') {
      api('POST', '/api/auth/login', { loginId: document.getElementById('lid').value.trim() }).then(function (d) {
        if (!d.manager) throw new Error(t('unknownStaff'));
        if (!d.access || !d.access.office) throw new Error(t('noOffice'));
        saveSession({ token: d.token, loginId: d.manager.login_id, name: d.manager.name, position: d.manager.position, campus: d.manager.campus });
        return start();
      }).catch(function (err) { renderLogin(err.message); });
    }
    if (id === 'stuForm') searchStudents(document.getElementById('stuSearch').value.trim());
    if (id === 'crudSave') {
      var body = crudValues(editing.name);
      var p = editing.id ? api('PATCH', '/api/campus-admin/' + editing.name + '/' + editing.id, body) : api('POST', '/api/campus-admin/' + editing.name, body);
      p.then(function () { flash(t('saved'), true); document.getElementById('crudForm').innerHTML = ''; loadCrud(editing.name); }).catch(function (err) { flash(err.message); });
    }
    if (id === 'scoreFind') {
      api('GET', '/api/campus-admin/scores?studentId=' + encodeURIComponent(document.getElementById('scoreSid').value.trim())).then(function (d) { document.getElementById('scoreList').innerHTML = scoreTable(d.scores); }).catch(function (err) { flash(err.message); });
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'langSel') {
      setLang(e.target.value);

      // keep what the staff typed in the request search box
      var fs = document.getElementById('fSearch'); if (fs) state.search = fs.value.trim();
      return show();
    }
    if (e.target.id === 'fStatus') { state.status = e.target.value; loadRequests(); }
    if (e.target.id === 'fType') { state.type = e.target.value; loadRequests(); }
  });
  document.addEventListener('keydown', function (e) { if (e.target.id === 'fSearch' && e.key === 'Enter') { state.search = e.target.value.trim(); loadRequests(); } });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'logout') { saveSession(null); return renderLogin(); }
    if (b.hasAttribute('data-tab')) { tab = b.getAttribute('data-tab'); return show(); }
    if (b.id === 'reload') { state.search = document.getElementById('fSearch').value.trim(); return loadRequests(); }
    if (b.hasAttribute('data-decide')) {
      var rid = b.getAttribute('data-decide'), st = b.getAttribute('data-status');
      var note = (document.getElementById('note' + rid) || {}).value || '';
      if (st === 'rejected' && !note.trim()) return flash(t('rejectNeedsNote'));
      b.disabled = true;
      return api('POST', '/api/campus-admin/requests/' + rid, { status: st, note: note }).then(function (d) {
        flash(t('decided')(rid, statusName(d.request.status), d.request.charged && st === 'approved' ? peso(d.request.fee) : ''), true); loadRequests();
      }).catch(function (err) { b.disabled = false; flash(err.message); });
    }
    if (b.hasAttribute('data-code')) {
      var pid = b.getAttribute('data-code');
      b.disabled = true;
      return api('POST', '/api/campus-admin/students/' + pid + '/activation', {}).then(function (d) {
        document.getElementById('code' + pid).innerHTML = '<div style="margin-top:8px"><span class="codebox">' + esc(d.code) + '</span><div class="small muted">' + esc(t('codeGiven')(d.name, d.studentId, d.expires)) + '</div></div>';
      }).catch(function (err) { b.disabled = false; flash(err.message); });
    }
    if (b.hasAttribute('data-unfreeze')) {
      return api('POST', '/api/campus-admin/students/' + b.getAttribute('data-unfreeze') + '/unfreeze', {}).then(function () { flash(t('unfrozen'), true); searchStudents(document.getElementById('stuSearch').value.trim()); }).catch(function (err) { flash(err.message); });
    }
    if (b.hasAttribute('data-add')) return crudForm(b.getAttribute('data-add'), null);
    if (b.hasAttribute('data-edit')) { var row = crudRows.filter(function (r) { return String(r.id) === b.getAttribute('data-edit'); })[0]; return crudForm(tab, row); }
    if (b.hasAttribute('data-cancelform')) { document.getElementById('crudForm').innerHTML = ''; return; }
    if (b.hasAttribute('data-delete')) {
      if (b.getAttribute('data-sure') !== '1') { b.setAttribute('data-sure', '1'); b.textContent = t('delSure'); return; }
      return api('DELETE', '/api/campus-admin/' + editing.name + '/' + b.getAttribute('data-delete')).then(function () { flash(t('deleted'), true); document.getElementById('crudForm').innerHTML = ''; loadCrud(editing.name); }).catch(function (err) { flash(err.message); });
    }
    if (b.id === 'previewCsv') {
      csvRows = parseCsv(document.getElementById('csv').value);
      document.getElementById('csvInfo').textContent = csvRows.length ? t('rowsReady')(csvRows.length) : t('noRows');
      document.getElementById('importCsv').disabled = !csvRows.length;
      document.getElementById('scoreList').innerHTML = scoreTable(csvRows);
    }
    if (b.id === 'importCsv') {
      b.disabled = true;
      return api('POST', '/api/campus-admin/scores', { rows: csvRows }).then(function (d) {
        flash(t('imported')(d.saved) + (d.unknownStudentIds.length ? ' ' + t('notFoundIds') + d.unknownStudentIds.join(', ') : ''), !d.unknownStudentIds.length);
        document.getElementById('csv').value = ''; csvRows = [];
      }).catch(function (err) { b.disabled = false; flash(err.message); });
    }
  });

  function start() {
    return api('GET', '/api/campus/config').then(function (c) { config = c; c.types.forEach(function (x) { TYPES[x.key] = x; }); show(); });
  }
  if (session) start().catch(function (e) { renderLogin(e.message); }); else renderLogin();
})();
</script>
</body>
</html>
